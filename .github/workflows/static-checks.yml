name: Static candidate checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate links, scripts, state, calculations and mock integrations
        run: node --test tests/*.test.mjs tests/*.test.cjs
# This workflow never deploys or sends real data to Google.
